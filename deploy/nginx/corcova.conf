upstream corcova_backend {
    server unix:/run/corcova/gunicorn.sock;
}

server {
    server_name 51.178.25.243 comunacorcova.ro www.comunacorcova.ro;

    root /srv/corcova-website/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 50m;
    limit_conn corcova_connections 30;

    if ($corcova_bad_path) {
        return 400;
    }

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    # Historic public archives are read-only. Active or executable formats are
    # never served, even if a malicious file reaches the filesystem.
    location ~* ^/(?:uploads|dosare)/.*\.(?:asp|aspx|bat|cgi|cmd|com|config|cpl|dll|env|exe|htm|html|ini|jar|js|jsp|lnk|mjs|msi|php|phtml|pl|ps1|py|rb|scr|sh|so|sql|sqlite|sqlite3|svg|swp|vbs|war|wsf|xml|xsl|xslt)$ {
        return 404;
    }

    location /static/ {
        alias /srv/corcova-website/backend/staticfiles/;
        autoindex off;
        disable_symlinks if_not_owner from=/srv/corcova-website/backend/staticfiles/;
        expires 7d;
    }

    location /dosare/ {
        alias /srv/corcova-website/dosare/;
        autoindex off;
        disable_symlinks if_not_owner from=/srv/corcova-website/dosare/;
    }

    location /uploads/ {
        alias /srv/corcova-website/uploads/;
        autoindex off;
        disable_symlinks if_not_owner from=/srv/corcova-website/uploads/;
    }

    location ~ ^/api/v1/sites/[^/]+/(?:contact|chatbot)/ {
        limit_req zone=corcova_sensitive burst=8 nodelay;
        proxy_pass http://corcova_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=corcova_api burst=60 nodelay;
        proxy_pass http://corcova_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ ^/(?:gestionare-primarie|admin|administrare-primarie)(?:/|$) {
        limit_req zone=corcova_admin burst=10 nodelay;
        proxy_pass http://corcova_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/comunacorcova.ro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/comunacorcova.ro/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 51.178.25.243 comunacorcova.ro www.comunacorcova.ro;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://comunacorcova.ro$request_uri;
}
