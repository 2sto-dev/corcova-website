# Loaded from nginx.conf's http{} context via /etc/nginx/conf.d/*.conf.
limit_req_zone $binary_remote_addr zone=corcova_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=corcova_sensitive:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=corcova_admin:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=corcova_connections:10m;

map $request_uri $corcova_bad_path {
    default 0;
    ~*(?:\.\.|%2e%2e|%252e%252e|%5c|%255c) 1;
}
